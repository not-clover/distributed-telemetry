name: 🔬 Spike
description: Timeboxed research to answer a question before building
labels: ["type:spike"]
body:
  - type: textarea
    id: question
    attributes:
      label: Question to answer
    validations:
      required: true
  - type: input
    id: timebox
    attributes:
      label: Timebox
      placeholder: e.g. 2 hours
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Expected output
      description: Wiki page, ADR, prototype branch …
