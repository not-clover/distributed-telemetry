version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule: { interval: weekly, day: saturday }
    groups:
      python-deps: { patterns: ["*"] }
    commit-message: { prefix: "build(deps)" }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: saturday }
    groups:
      actions: { patterns: ["*"] }
    commit-message: { prefix: "ci(deps)" }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly, day: saturday }
    commit-message: { prefix: "build(docker)" }
