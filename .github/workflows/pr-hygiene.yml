name: PR hygiene

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  title:
    name: Conventional Commit title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            test
            refactor
            perf
            build
            ci
            chore
          scopes: |
            agent
            collector
            detector
            cli
            edge-agent
            api
            observability
            deps
            docs
            release
            docker
            main

  linked-issue:
    name: Linked issue
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = pr.body || "";
            const isBot = pr.user.type === "Bot";
            const linked = /(close[sd]?|fix(e[sd])?|resolve[sd]?)\s+#\d+/i.test(body);
            if (!isBot && !linked) {
              core.setFailed("Link the issue in the PR description, e.g. 'Closes #12'.");
            }

  label:
    name: Auto-label by path
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v7
