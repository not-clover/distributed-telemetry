# Wiki-as-code: pages live in docs/wiki/ and are reviewed in PRs like any other change.
# One-time setup: create any page in the Wiki tab first, so the wiki git repo exists.
name: Sync wiki

on:
  push:
    branches: [main]
    paths: ["docs/wiki/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Andrew-Chen-Wang/github-wiki-action@v4
        with:
          path: docs/wiki
