global:
  scrape_interval: 5s
  evaluation_interval: 5s

# rule_files: ["alerts.yml"]   # TODO(v0.3): alert rules

scrape_configs:
  # DNS service discovery finds every scaled collector replica.
  - job_name: collector
    dns_sd_configs:
      - names: ["collector"]
        type: A
        port: 9100
  - job_name: detector
    static_configs:
      - targets: ["detector:9101"]
