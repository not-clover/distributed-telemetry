# Full CellPulse stack. Usage: make up  (or: docker compose -f deploy/docker-compose.yml up --build)
# Scale collectors: docker compose -f deploy/docker-compose.yml up --scale collector=2
name: cellpulse

x-agent: &agent
  build: ..
  image: cellpulse:dev
  depends_on: [collector]
  restart: unless-stopped

services:
  collector:
    build: ..
    image: cellpulse:dev
    command: ["cellpulse-collector"]
    expose: ["50051", "9100"]
    restart: unless-stopped
    # TODO(v0.1): add healthcheck once the Health RPC exists

  agent-site-a:
    <<: *agent
    command: ["cellpulse-agent"]  # TODO(v0.1): --site site-a --cells 20 --target dns:///collector:50051
  agent-site-b:
    <<: *agent
    command: ["cellpulse-agent"]  # TODO(v0.1): --site site-b --cells 20
  agent-site-c:
    <<: *agent
    command: ["cellpulse-agent"]  # TODO(v0.1): --site site-c --cells 20

  detector:
    image: cellpulse:dev
    command: ["cellpulse-detector"]
    depends_on: [prometheus]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]
