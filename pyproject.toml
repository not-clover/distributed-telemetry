[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "cellpulse"
version = "0.1.0"  # managed by release-please
description = "Distributed telemetry for simulated 5G radio cells"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "grpcio>=1.66",
    "protobuf>=5.28",
    "prometheus-client>=0.21",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "grpcio-tools>=1.66",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "pre-commit>=4.0",
]

[project.scripts]
cellpulse-agent = "cellpulse.agent.__main__:main"
cellpulse-collector = "cellpulse.collector.__main__:main"
cellpulse-detector = "cellpulse.detector.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cellpulse"]
# Generated protobuf code is git-ignored, so it must be force-included.
artifacts = ["src/cellpulse/v1/*_pb2*.py", "src/cellpulse/v1/*_pb2*.pyi"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["src/cellpulse/v1/*_pb2*.py", "src/cellpulse/v1/*_pb2*.pyi"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
exclude = ["src/cellpulse/v1/.*_pb2.*\\.py$"]

[[tool.mypy.overrides]]
module = ["cellpulse.v1.*", "grpc.*"]
ignore_missing_imports = true
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=cellpulse --cov-report=term-missing --cov-report=xml"

[tool.coverage.run]
omit = ["src/cellpulse/v1/*"]
