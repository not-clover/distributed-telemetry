// CellPulse telemetry API, v1.
// Any breaking change requires a new package version (cellpulse.v2).
// Field numbers are never renumbered or reused.
syntax = "proto3";

package cellpulse.v1;

import "google/protobuf/timestamp.proto";

// Ingest and health API exposed by every collector.
service TelemetryService {
  // Agents open one long-lived client stream and send a batch every interval.
  // The collector replies once, when the stream closes.
  rpc StreamKpis(stream KpiBatch) returns (StreamSummary);

  // Liveness and basic info, and health checks.
  rpc Health(HealthRequest) returns (HealthResponse);
}

// One sample of radio KPIs for a single cell.
//
// Missing data: if a cell has no measurement for an interval, the agent leaves it
// out of KpiBatch.samples. Every field in a sample is a real measurement, so 0 means
// "measured zero" (e.g. a sleeping cell), never "unknown".
message CellKpi {
  // Cell identifier: "<site_id>/cell-<NNN>", e.g. "site-a/cell-007".
  string cell_id = 1;

  // When the measurement was taken.
  google.protobuf.Timestamp observed_at = 2;

  // Integrity: downlink throughput per user, Mbps. Higher is better.
  double dl_throughput_mbps = 3;

  // Integrity: uplink throughput per user, Mbps. Higher is better.
  double ul_throughput_mbps = 4;

  // Utilization: share of physical resource blocks (radio capacity) in use, 0-100 %.
  double prb_utilisation_pct = 5;

  // Integrity: user-plane latency, ms. Lower is better.
  double latency_ms = 6;

  // Utilization: number of connected devices (user equipments).
  uint32 active_ues = 7;

  // Retainability: share of connections that dropped, 0-100 %. Lower is better.
  double call_drop_rate_pct = 8;

  // Accessibility: share of connection setups that succeeded, 0-100 %. Higher is better.
  double rrc_success_rate_pct = 9;

  // Radio quality: signal-to-interference-plus-noise ratio (SINR), dB. Higher is better.
  double sinr_db = 10;
}

// Everything an agent observed during one interval.
message KpiBatch {
  string site_id = 1;
  uint64 sequence = 2;                      // monotonic per agent; used to detect gaps/duplicates
  google.protobuf.Timestamp sent_at = 3;
  repeated CellKpi samples = 4;
}

message StreamSummary {
  uint64 batches_received = 1;
  uint64 samples_received = 2;
}

message HealthRequest {}

message HealthResponse {
  string version = 1;
  uint64 uptime_seconds = 2;
  repeated string connected_sites = 3;
}
